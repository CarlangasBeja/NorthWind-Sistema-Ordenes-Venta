<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1b35" />
    <title>NorthWind Ventas</title>
    <base href="/" />
    <script src="js/theme.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="NorthWind.Sales.BlazorClient.styles.css" rel="stylesheet" />
</head>
<body>
    <div id="app">
        <div style="min-height:100vh;display:grid;place-items:center;background:#f5f7fb;font-family:Segoe UI,Arial,sans-serif;color:#172033">
            <div style="text-align:center">
                <div style="width:52px;height:52px;display:grid;place-items:center;margin:0 auto 14px;border-radius:14px;background:#2563eb;color:white;font-weight:800">NW</div>
                <strong style="display:block;font-size:1.05rem">Iniciando NorthWind Ventas</strong>
                <span style="display:block;margin-top:5px;color:#64748b;font-size:.9rem">Preparando el sistema...</span>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Ocurrió un problema inesperado en la aplicación.
        <a href="" class="reload">Recargar página</a>
        <a class="dismiss">×</a>
    </div>

    <script src="js/invoice-pdf.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
